id: arendt
title: Hannah Arendt
group: thinkers
sequence: 6
born: 1906
scope: >
  Arendt's books and essay collections, from her dissertation on Augustine to the
  unfinished Life of the Mind. Political philosophy: totalitarianism, action, freedom,
  revolution, judgment.
status: draft

# Format: see the header of lists/nietzsche.yaml. Her texts are in copyright, so the
# evidence is the SEP, the IEP and course syllabi.

