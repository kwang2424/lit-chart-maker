    includes: [philosophy-of-history, phenomenology, philosophy-of-right]
    ordered: true
    locator: schedule (then Marx, then Nietzsche's Genealogy)
    verified: true
    checked_in: Course syllabus (PDF), accessed 2026-11
  - source: syl-mcgill-460
    starts_with: phenomenology
