id: hegel
title: G. W. F. Hegel
group: predecessors
sequence: 5
born: 1770
scope: >
  Hegel's books and the lecture courses published after his death, with the two
  guides courses most often recommend. Nietzsche and Deleuze both define themselves
  against him, so a summary-level grasp is enough for most readers of this site.
status: draft

# Format: see the header of lists/nietzsche.yaml.

survey:
  - source: syl-oregon-hegel
    starts_with: phenomenology
    includes: [phenomenology]
    ordered: true
    locator: course description and schedule
    verified: true
    checked_in: Course syllabus (PDF), accessed 2026-11
  - source: syl-ucsd-hardimon
    starts_with: phenomenology
    includes: [phenomenology]
    ordered: true
