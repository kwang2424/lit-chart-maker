id: schelling
title: F. W. J. Schelling
group: predecessors
sequence: 12
born: 1775
scope: >
  Schelling's main works across his changing positions: the early essays answering Fichte
  and Jacobi, the philosophy of nature and transcendental idealism, the identity
  philosophy, the 1809 Freedom essay, the Ages of the World drafts and the late Munich and
  Berlin lectures. No course found is devoted to Schelling alone; each surveyed course
  reads one text in a wider German Idealism course, so the tiers lean on the SEP and IEP.
status: draft

# Format: see the header of lists/nietzsche.yaml. His texts are not on Project Gutenberg in
# English; the evidence is the SEP and IEP entries, later authors' own texts and courses.
# Years are first publication or, for posthumous lectures, left blank.

survey:
  - source: syl-hse-chernavin
    includes: [sti]
    ordered: false
    locator: lecture 3 (required reading)
    verified: true
    checked_in: Course syllabus (PDF, 2015), accessed 2026-11
  - source: syl-ciis-segall
    includes: [history-modern]
    ordered: false
    locator: required texts; weeks 5, 8 and 9 on Schelling
    verified: true
    checked_in: Course syllabus (PDF, Spring 2017), accessed 2026-11
  - source: syl-carleton-gurofsky
