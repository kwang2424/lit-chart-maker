id: fichte
title: J. G. Fichte
group: predecessors
sequence: 11
born: 1762
scope: >
  Fichte's main works, from the Critique of All Revelation to the Addresses to the German
  Nation: the Jena Wissenschaftslehre (Doctrine of Science) and its branches in right and
  ethics, the popular Berlin writings, and two of the later lecture versions of the system.
  Years are first publication, from the SEP.
status: draft

# Format: see the header of lists/nietzsche.yaml. Free older translations: Kroeger's
# Science of Knowledge (1889) and Science of Ethics (1897), and Smith's Popular Works
# (1873), on archive.org. Modern translations are by Breazeale and others.

