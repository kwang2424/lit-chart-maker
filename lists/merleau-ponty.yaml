id: merleau-ponty
title: Maurice Merleau-Ponty
group: thinkers
sequence: 7
born: 1908
scope: >
  Merleau-Ponty's two theses on behaviour and perception, the essays on art, language and
  politics, and the late, unfinished ontology. Most courses found teach only the
  Phenomenology of Perception, so the later works' tiers rest on the SEP and one course on
  his aesthetics.
status: draft

# Format: see the header of lists/nietzsche.yaml. Years are first French publication,
# from the SEP.

