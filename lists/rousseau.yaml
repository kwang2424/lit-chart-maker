id: rousseau
title: Jean-Jacques Rousseau
group: predecessors
sequence: 8
born: 1712
scope: >
  Rousseau's philosophical and political works, from the two Discourses to the Social
  Contract and Emile, with the novel, the letter on the theatre and the autobiographical
  writings. His music and botany are left out. Years are first publication, from the
  SEP's list of principal works; works it dates only by composition are left undated.
status: draft

