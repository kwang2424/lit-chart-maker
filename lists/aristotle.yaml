beginner:
  work: barnes-vsi
  why: >
    Oxford's finals guide lists chapter 18 of this book (with Shields's Aristotle) as
    introductory reading for its Nicomachean Ethics paper.
  sources:
    - source: oxford-finals
      locator: "116. Aristotle, Nicomachean Ethics — Introductory reading"
      verified: true
      checked_in: Course descriptions (web page), accessed 2026-11

works:

  - id: barnes-vsi
    title: "Aristotle: A Very Short Introduction"
    author: Jonathan Barnes
    year: 2000
    kind: secondary
    tier: optional
    position: start
    difficulty: 1
    note: A short overview; Oxford's Ethics paper lists one of its chapters as introductory reading.
    tips:
      - text: >
          The SEP warns that "Aristotle's writings tend to present formidable difficulties to
          his novice readers": they are lecture notes and drafts, with heavy technical
          vocabulary, and "Aristotle's prose requires some acclimatization".
        sources:
          - source: sep-aristotle
            locator: "§2 The Aristotelian Corpus"
            verified: true
            checked_in: SEP entry, accessed 2026-11

  # ---------- Logic (the Organon) ----------

  - id: categories
    title: Categories
    author: Aristotle
    kind: primary
    tier: core
    difficulty: 3
    translation: Edghill (free online)
    note: >
      On substance and accidents, subjects and predicates (McGill's course description).
      McGill and Yale assign chapters 1–5.

  - id: de-interpretatione
    title: De Interpretatione (On Interpretation)
    author: Aristotle
    kind: primary
    tier: extended
    difficulty: 3
    note: On propositions and terms; part of the Organon (SEP §2).

  - id: prior-analytics
    title: Prior Analytics
    author: Aristotle
    kind: primary
    tier: extended
    difficulty: 4
    note: The syllogism; with the Topics, the main treatment of logic and argument (SEP §2).

  - id: posterior-analytics
    title: Posterior Analytics
    author: Aristotle
    kind: primary
    tier: extended
    difficulty: 4
    note: The structure of scientific knowledge and demonstration (SEP §2). UCSD's course reads I.1–3 and II.19.
    after:
      - work: prior-analytics
        strength: helpful
        why: >
          Both ordered courses that teach the logic read the Prior Analytics, on the
          syllogism, before the Posterior Analytics, on demonstration.
        sources:
          - source: syl-ucsd-johnson
            locator: weeks 3–4
            verified: true
            checked_in: Course syllabus (PDF, Winter 2019), accessed 2026-11
          - source: syl-uvm-bailly
            locator: weeks 6–8
            verified: true
            checked_in: Course syllabus (web page, Fall 2024), accessed 2026-11

  - id: topics
    title: Topics
    author: Aristotle
    kind: primary
    tier: optional
    difficulty: 3
    note: On dialectical argument; Columbia's course uses excerpts as "a book on method".

  # ---------- Nature, soul, first philosophy ----------

  - id: physics
    title: Physics
    author: Aristotle
    kind: primary
    tier: core
    difficulty: 4
    note: >
      Nature, explanation (including teleology), chance, change, time, place and the
      infinite (Oxford's paper description). Courses concentrate on Books I–II; Oxford
      adds III and IV.

  - id: de-anima
    title: De Anima (On the Soul)
    author: Aristotle
    kind: primary
    tier: core
    difficulty: 4
    note: The soul and its relation to the body; perception, emotion and thought (Oxford's paper description).

  - id: parts-animals
    title: Parts of Animals
    author: Aristotle
    kind: primary
    tier: optional
    difficulty: 3
    note: Book I is the part Oxford's and UCSD's courses assign.

  - id: generation-animals
    title: Generation of Animals
    author: Aristotle
    kind: primary
    tier: optional
    difficulty: 4
    note: Reproduction and inheritance; McGill's course reads it on sexual difference and resemblance.

  - id: metaphysics
    title: Metaphysics
    author: Aristotle
    kind: primary
    tier: core
    difficulty: 5
    note: >
      "First philosophy" (SEP §2). Book I opens with the claim that all human beings desire
      to know, and reviews his predecessors (Columbia's course). Courses read selections,
      among them Books I, IV, VII and XII.

  # ---------- Ethics and politics ----------

  - id: ne
    title: Nicomachean Ethics
    author: Aristotle
    kind: primary
    tier: core
    difficulty: 3
    translation: Irwin (Hackett), Oxford's set text; older free version (Project Gutenberg)
    note: >
      Happiness, the virtues, responsibility, practical wisdom, weakness of will, pleasure
      and friendship. Oxford's paper calls it "one of the most important works in the
      history of philosophy".
    tips:
      - text: >
          If you read only one book of Aristotle's, general guides choose this one: it is
          the only Aristotle chapter in Warburton's Philosophy: The Classics, and St John's
          College reads it in the first year, before the logical works (the Categories
          comes in the second year).
        sources:
          - source: warburton-classics
            locator: table of contents, ch. 2
            verified: true
            checked_in: Routledge book page (table of contents), accessed 2026-11
          - source: sjc-reading-list
            locator: Freshman and Sophomore reading lists
            verified: true
            checked_in: Reading list web page, accessed 2026-11

  - id: politics
    title: Politics
    author: Aristotle
    kind: primary
    tier: extended
    difficulty: 3
    translation: Ellis (free online)
    note: The household and the city, citizenship and constitutions (McGill's schedule).
    after:
      - work: ne
        strength: helpful
        why: >
          The Ethics ends by turning to legislation and "the whole subject of Polity, that
          thus what we may call Human Philosophy may be completed", announcing the study of
          constitutions that the Politics carries out.
        sources:
          - source: aristotle-ne-text
            locator: "Book X, last chapter"
            verified: true
            checked_in: "Project Gutenberg #8438"
      - work: plato:republic
        strength: context
        why: >
          It argues with Plato's Republic directly: "when Socrates, in Plato's Republic, says
          that a city is necessarily composed of four sorts of people, he speaks elegantly but
          not correctly".
        sources:
          - source: aristotle-politics-text
            locator: "Book IV, ch. 4"
            verified: true
            checked_in: "Ellis trans. (1912), Project Gutenberg #6762"

  # ---------- Rhetoric and poetics ----------

  - id: rhetoric
    title: Rhetoric
    author: Aristotle
    kind: primary
    tier: optional
    difficulty: 3
    note: The principles of persuasive speech, including in political assemblies (SEP §2).

  - id: poetics
    title: Poetics
    author: Aristotle
    kind: primary
    tier: extended
    difficulty: 2
    translation: Butcher (free online)
    note: On tragedy; UVM's course reads it with the Rhetoric.
    after:
      - work: rhetoric
        strength: helpful
        why: >
          On "Thought" in tragedy, Aristotle writes: "we may assume what is said in the
          Rhetoric, to which inquiry the subject more strictly belongs."
        sources:
          - source: aristotle-poetics-text
            locator: "ch. XIX"
            verified: true
            checked_in: "Butcher trans., Project Gutenberg #1974"
