id: aristotle
title: Aristotle
group: predecessors
sequence: 2
born: -384
scope: >
  Aristotle's main surviving treatises, grouped as he divided the sciences: the logical
  works (the Organon), the theoretical sciences (nature, soul, first philosophy), the
  practical (ethics and politics) and the productive (rhetoric and poetics). The works
  are lecture notes rather than finished books, and cannot be dated reliably, so no years
  are given.
status: draft

# Format: see the header of lists/nietzsche.yaml. Public-domain translations: the
# Nicomachean Ethics (Project Gutenberg #8438), Ellis's Politics (#6762), Butcher's
# Poetics (#1974). Courses disagree about where to start: the Categories, the Physics,
# the Metaphysics and the Ethics each open at least one.

