    ordered: true
    locator: course description (readings listed in order)
    verified: true
    checked_in: Course web page, accessed 2026-11
  - source: syl-warwick-en3e8
    includes: [studies-hysteria, three-essays, on-narcissism, ego-and-id, interpretation-of-dreams, moses]
