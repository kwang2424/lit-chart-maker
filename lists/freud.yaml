id: freud
title: Sigmund Freud
group: predecessors
sequence: 17
born: 1856
scope: >
  Freud's major books and the shorter papers most often taught. Background for
  Jung, who began as his closest collaborator, and for Deleuze and Guattari's
  Anti-Oedipus.
status: draft

# Format: see the header of lists/nietzsche.yaml.

