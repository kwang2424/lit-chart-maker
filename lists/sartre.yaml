id: sartre
title: Jean-Paul Sartre
group: thinkers
sequence: 5
born: 1905
scope: >
  Sartre's philosophical works from the 1930s phenomenological essays to the Critique of
  Dialectical Reason, with the lecture that made existentialism famous and a few of the
  novels, plays and biographies that carry his philosophy. His texts are in copyright,
  so the evidence is the SEP and IEP and course syllabi.
status: draft

# Format: see the header of lists/nietzsche.yaml. Years are first French publication,
# from the SEP bibliography.

survey:
  - source: syl-mcgill-375
    starts_with: humanism
    includes: [humanism, being-nothingness]
    ordered: true
    locator: schedule (Sept. 9 onwards; with Camus, Merleau-Ponty, Beauvoir and Fanon)
    verified: true
    checked_in: Course syllabus (PDF, Fall 2013), accessed 2026-11
  - source: syl-bard-colony
    starts_with: being-nothingness
    includes: [being-nothingness, humanism, no-exit, nausea]
    ordered: true
    locator: "schedule, Apr. 2–18 (after Kierkegaard, Nietzsche and Heidegger)"
    verified: true
    checked_in: Course syllabus (PDF, Spring 2024), accessed 2026-11
  - source: syl-uvic-311
    starts_with: transcendence-ego
    includes: [transcendence-ego, imaginary]
    ordered: true
    locator: schedule
    verified: true
    checked_in: Course outline (PDF, Spring 2017), accessed 2026-11
  - source: syl-edinburgh-sartre
