id: descartes
title: René Descartes
group: predecessors
sequence: 5
born: 1596
scope: >
  Descartes's philosophical works, from the unfinished Rules to the Passions of the Soul,
  with the Objections and Replies and the correspondence with Elisabeth. The mathematics
  and physics appear only as the essays published with the Discourse. Few dedicated
  syllabi were reachable, so the survey is thin; his own prefaces carry the order.
status: draft

# Format: see the header of lists/nietzsche.yaml. Public-domain translations: Veitch's
# Discourse (Project Gutenberg #59) and Principles selections (#4391), Molyneux's
# Meditations (#70091). Years are first publication, from the SEP.

