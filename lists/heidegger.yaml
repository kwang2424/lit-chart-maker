id: heidegger
title: Martin Heidegger
group: thinkers
sequence: 3
born: 1889
scope: >
  Being and Time, the lectures around it, and the later essays on art, technology and
  language that shaped French philosophy after the war. His support for National
  Socialism "has been amply documented" (SEP §3); the Black Notebooks (published from
  2014) belong to any serious study of him.
status: draft

# Format: see the header of lists/nietzsche.yaml. His texts are in copyright, so the
# evidence is mostly the SEP, the IEP and course syllabi rather than his own prefaces.

