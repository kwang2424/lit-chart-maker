id: plato
title: Plato
group: predecessors
sequence: 1
born: -428
scope: >
  The dialogues most read and taught, grouped as the SEP describes the common
  (and disputed) early, middle and late division. Plato's dates are uncertain,
  so works carry no years and the order comes from the links and the survey.
status: draft

