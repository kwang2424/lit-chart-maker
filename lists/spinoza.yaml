    starts_with: tie
    includes: [tie, ethics, letters]
    ordered: true
    locator: "Meeting 1: TIE secs. 1–17, Ethics Part I, Letters"
    verified: true
    checked_in: Course syllabus, accessed 2026-11
  - source: syl-garrett-spinoza
    starts_with: ethics
    includes: [ethics]
    ordered: true
    locator: schedule (Ethics I with Descartes' Principles I; Descartes is now his own list)
    verified: true
    checked_in: Course syllabus, accessed 2026-11
  - source: syl-uw-rosenthal
    starts_with: tie
    includes: [tie, ttp, ethics]
    ordered: true
    locator: schedule (Spinoza Reader pp. 3–6, then TTP, then the Ethics)
    verified: true
    checked_in: Course syllabus, accessed 2026-11
  - source: syl-duke-surin
    includes: [ethics, ttp, political-treatise]
    ordered: true
