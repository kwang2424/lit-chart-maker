works:

  - id: tie
    title: Treatise on the Emendation of the Intellect
    author: Baruch Spinoza
    year: 1662
    kind: primary
    tier: core
    difficulty: 2
    note: >
      Unfinished essay on method, written in the early 1660s and published after his death.
      Its opening sections, on why he turned to philosophy, are the usual way in.
    tips:
      - text: Courses that start here assign just the opening sections (§§1–17).
        sources:
          - source: syl-ucsd-spinoza
            locator: "Meeting 1"
            verified: true
            checked_in: Course syllabus, accessed 2026-11

  - id: short-treatise
    title: Short Treatise on God, Man and His Well-Being
    author: Baruch Spinoza
    year: 1660
    kind: primary
    tier: optional
    position: end
    difficulty: 3
    note: The SEP calls it "an initial but aborted effort" to lay out the views of the Ethics.

  - id: ppc
    title: Principles of Cartesian Philosophy
    author: Baruch Spinoza
    year: 1663
    kind: primary
    tier: optional
    difficulty: 4
    note: The only work he published under his own name in his lifetime.
    after:
      - work: descartes:principles
        strength: helpful
        why: It is his critical exposition of Descartes's Principles of Philosophy.
        sources:
          - source: sep-spinoza
            locator: "§1 Biography"
            verified: true
            checked_in: SEP online, accessed 2026-11

  - id: ttp
    tips:
      - text: >
          Steven Nadler, asked what a newcomer should read first: "I want to say you
          should go for the Ethics first because that is his philosophical masterpiece.
          But it's a really tough book... So I would suggest the Theological-Political
          Treatise... And then you'll be ready for the Ethics."
        sources:
          - source: fivebooks-nadler-spinoza
            locator: "pick 1"
            verified: true
            checked_in: Five Books interview (web page), accessed 2026-11
    title: Theological-Political Treatise
    author: Baruch Spinoza
    year: 1670
    kind: primary
    tier: extended
    difficulty: 3
    note: >
      Scripture read as history, and a defence of the freedom to philosophize. Published
      anonymously, and the most scandalous book of its day.

  - id: ethics
    title: Ethics
    author: Baruch Spinoza
    year: 1677
    kind: primary
    tier: core
    difficulty: 5
    translation: Curley (Princeton / Penguin) or Elwes (free online)
    note: >
      His masterpiece, set out "in geometrical order": God or Nature (I), mind (II), the
      emotions (III–IV) and freedom (V). Read slowly, one Part at a time.
    tips:
      - text: >
          Nadler suggests reading it alongside Edwin Curley's Behind the Geometrical
          Method, "relatively short, only about 130 pages... a nice accessible
          introduction to the main themes of Spinoza's philosophy", focused on the
          Ethics.
        sources:
          - source: fivebooks-nadler-spinoza
            locator: "pick 2"
            verified: true
            checked_in: Five Books interview (web page), accessed 2026-11
      - text: >
          The Appendix to Part I is a vivid, readable attack on the idea that nature acts for
          ends, and is often assigned with the Part I propositions.
        sources:
          - source: sep-spinoza
            locator: "§2.1 God or Nature"
            verified: true
            checked_in: SEP online, accessed 2026-11
          - source: syl-garrett-spinoza
            locator: "schedule (Part I, Propositions 16–36 and Appendix)"
            verified: true
            checked_in: Course syllabus, accessed 2026-11
    after:
      - work: descartes:principles
        strength: helpful
        why: >
          Courses read Part I's definitions alongside Descartes's Principles, or read the
          Meditations first; Spinoza's vocabulary of substance and attribute is Cartesian.
        sources:
          - source: syl-garrett-spinoza
            locator: "schedule (Ethics I definitions with Descartes, Principles I §§51–64)"
            verified: true
            checked_in: Course syllabus, accessed 2026-11
          - source: syl-duke-surin
            locator: schedule
            verified: true
            checked_in: Course syllabus, accessed 2026-11
      - work: tie
        strength: context
        why: Two of four surveyed courses open with the Emendation's first sections before Part I.
        sources:
          - source: syl-ucsd-spinoza
            locator: "Meeting 1"
            verified: true
            checked_in: Course syllabus, accessed 2026-11
          - source: syl-uw-rosenthal
            locator: schedule
            verified: true
            checked_in: Course syllabus, accessed 2026-11

  - id: letters
    title: Letters (selected)
    author: Baruch Spinoza
    kind: primary
    tier: optional
    difficulty: 3
    note: His correspondence answers objections to the Ethics; read the relevant letters alongside each Part.
    after:
      - work: ethics
        strength: context
        why: One course assigns selected letters with each Part of the Ethics.
        sources:
          - source: syl-ucsd-spinoza
            locator: Meetings 1 and 3
            verified: true
            checked_in: Course syllabus, accessed 2026-11

  - id: political-treatise
    title: Political Treatise
    author: Baruch Spinoza
    year: 1677
    kind: primary
    tier: optional
    position: end
    difficulty: 3
    note: Unfinished at his death.
    after:
      - work: ttp
        strength: context
        why: Courses that read it take it after the Theological-Political Treatise.
        sources:
          - source: syl-duke-surin
            locator: schedule
            verified: true
            checked_in: Course syllabus, accessed 2026-11

  - id: della-rocca
    title: Spinoza (Routledge Philosophers)
    author: Michael Della Rocca
    year: 2008
    kind: secondary
    tier: optional
    difficulty: 3
    note: A guide to the whole philosophy, listed in the SEP's recommended secondary literature.
