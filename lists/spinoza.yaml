id: spinoza
title: Baruch Spinoza
group: predecessors
sequence: 4
born: 1632
scope: >
  Spinoza's works, the Descartes he started from, and one modern guide. The Ethics
  is the centre; courses split on whether to open with his short essay on method.
status: draft

# Format: see the header of lists/nietzsche.yaml.

