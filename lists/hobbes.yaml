id: hobbes
title: Thomas Hobbes
group: predecessors
sequence: 4
born: 1588
scope: >
  Hobbes's political philosophy and the system it belongs to: the Elements of Law,
  De Cive and Leviathan, the other two parts of the Elements of Philosophy (De Corpore
  and De Homine), and Behemoth. His mathematics, physics and controversies are left out.
  Most courses read Leviathan alone, so the survey says little about the rest.
status: draft

