id: machiavelli
title: Niccolò Machiavelli
group: predecessors
sequence: 3
born: 1469
scope: >
  Machiavelli's political and historical works: The Prince and the Discourses on Livy,
  with the letter that describes writing The Prince, The Art of War, the Florentine
  Histories and the play Mandragola. Years are first publication; both main books
  appeared only after his death in 1527.
status: draft

# Format: see the header of lists/nietzsche.yaml. Public-domain text: Marriott's
# translation of The Prince with its introduction (Project Gutenberg #1232). Dates of
# writing and publication are from the SEP.

