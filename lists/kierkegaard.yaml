id: kierkegaard
title: Søren Kierkegaard
group: predecessors
sequence: 15
born: 1813
scope: >
  Kierkegaard's main pseudonymous works of 1843–46, the later "second authorship"
  (Works of Love, The Sickness Unto Death, Practice in Christianity), his dissertation on
  irony, his own account of his authorship, and one biography. Most of the upbuilding
  discourses and the late attack on the Church are left out. Years are first Danish
  publication, from the SEP's chronology.
status: draft

# Format: see the header of lists/nietzsche.yaml. His texts are in copyright in their
# standard English translations (Hong, Princeton; Hannay, Penguin); the evidence is the
# SEP and IEP entries and five course syllabi.

