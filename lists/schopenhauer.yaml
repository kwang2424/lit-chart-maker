works:

  - id: upanishads
    title: The Upanishads (a selection)
    kind: background
    tier: optional
    difficulty: 2
    note: Ancient Indian philosophical texts Schopenhauer read nightly and called the greatest gift of his century.

  - id: fourfold-root
    title: On the Fourfold Root of the Principle of Sufficient Reason
    author: Arthur Schopenhauer
    year: 1813
    kind: primary
    tier: core
    difficulty: 4
    translation: Payne (Open Court)
    tier_note: >
      Kept core though most courses go straight to the World as Will: Schopenhauer says that without it the main work cannot be properly understood.
    note: >
      His dissertation, and the "centerpiece of his later philosophy" according to the
      SEP: everything we explain falls under one of four kinds of ground.
    after:
      - work: kant:prolegomena
        strength: helpful
        why: Its claim that the subject–object distinction is the condition of all knowledge comes from Kant's first Critique.
        sources:
          - source: sep-schopenhauer
            locator: "§2 The Fourfold Root"
            verified: true
            checked_in: SEP online, accessed 2026-11

  - id: wwr
    title: The World as Will and Representation, vol. 1
    author: Arthur Schopenhauer
    year: 1818
    kind: primary
    tier: core
    difficulty: 4
    translation: Payne (Dover) or Norman, Welchman & Janaway (Cambridge)
    note: >
      Four books: the world as representation, as will, art, and ethics. Nietzsche's
      starting point and a major influence on Jung.
    tips:
      - text: >
          He advises reading his appendix, "Criticism of the Kantian Philosophy", first,
          and warns that the appendix and the book "must be read twice". Courses open with that
          preface.
        sources:
          - source: masny-schopenhauer
            locator: "Week 1"
            verified: true
            checked_in: Course syllabus (PDF), accessed 2026-11
          - source: schopenhauer-wwr-preface
            locator: Preface to the first edition
            verified: true
            checked_in: "Haldane & Kemp trans., Project Gutenberg #38427"
    after:
      - work: fichte:foundation
        strength: context
        why: >
          §7 sets its starting point against "the idealism of Fichte", which "reduces
          the object to the effect of the subject", and calls Fichte's "philosophy of
          appearance" the one example of deriving the object from the subject.
        sources:
          - source: schopenhauer-wwr-text
            locator: "Book I, §7"
            verified: true
            checked_in: "Haldane & Kemp trans., Project Gutenberg #38427"
      - work: descartes:meditations
        strength: context
        why: >
          Its opening claim, "The world is idea", was "implicitly involved in the
          sceptical reflections from which Descartes started".
        sources:
          - source: schopenhauer-wwr-text
            locator: "Book I, §1"
            verified: true
            checked_in: "Haldane & Kemp trans., Project Gutenberg #38427"
      - work: fourfold-root
        strength: required
        why: >
          He says that without this "introduction and propaedeutic" it is "absolutely
          impossible to understand the present work properly".
        sources:
          - source: schopenhauer-wwr-preface
            locator: Preface to the first edition
            verified: true
            checked_in: "Haldane & Kemp trans., Project Gutenberg #38427"
      - work: kant:prolegomena
        strength: required
        why: >
          "The philosophy of Kant ... is the only philosophy with which a thorough
          acquaintance is directly presupposed." The Prolegomena is Kant's own summary.
        sources:
          - source: schopenhauer-wwr-preface
            locator: Preface to the first edition
            verified: true
            checked_in: "Haldane & Kemp trans., Project Gutenberg #38427"
      - work: kant:kant-cpr
        strength: helpful
        why: The Kant he presupposes and criticizes in his appendix is above all the Critique.
        sources:
          - source: schopenhauer-wwr-preface
            locator: Preface to the first edition
            verified: true
            checked_in: "Haldane & Kemp trans., Project Gutenberg #38427"
      - work: plato:republic
        strength: helpful
        why: >
          A reader who "has lingered in the school of the divine Plato" will be "so much
          the better prepared".
        sources:
          - source: schopenhauer-wwr-preface
            locator: Preface to the first edition
            verified: true
            checked_in: "Haldane & Kemp trans., Project Gutenberg #38427"
      - work: upanishads
        strength: helpful
        why: >
          The third preparation he names: a reader who "is a partaker of the benefit
          conferred by the Vedas" through the Upanishads is best prepared of all.
        sources:
          - source: schopenhauer-wwr-preface
            locator: Preface to the first edition
            verified: true
            checked_in: "Haldane & Kemp trans., Project Gutenberg #38427"

  - id: wwr-2
    title: The World as Will and Representation, vol. 2 (Supplements)
    author: Arthur Schopenhauer
    year: 1844
    kind: primary
    tier: extended
    difficulty: 4
    note: Fifty chapters of supplements, each tied to a book of volume 1. More mature and often clearer.
    after:
      - work: wwr
        strength: required
        why: >
          He advises newcomers to "first of all read the first volume without using the
          supplementary books", and to use them only on a second reading.
        sources:
          - source: schopenhauer-wwr-preface2
            locator: Preface to the second edition
            verified: true
            checked_in: "Haldane & Kemp trans., Project Gutenberg #38427"

  - id: will-in-nature
    title: On the Will in Nature
    author: Arthur Schopenhauer
    year: 1836
    kind: primary
    tier: optional
    difficulty: 3
    note: A short book confirming his metaphysics with the science of his day.
    after:
      - work: wwr
        strength: context
        why: The SEP describes it as aiming "to confirm and reiterate his metaphysical views in light of scientific evidence".
        sources:
          - source: sep-schopenhauer
            locator: "§1 Life"
            verified: true
            checked_in: SEP online, accessed 2026-11

  - id: two-problems-ethics
    tips:
      - text: >
          David Bather Woods: the essays had to stand on their own, since he couldn't
          refer to his main work, so "if somebody was reading Schopenhauer for the first
          time and wanted to get a handle on his thought, it would be a good place to
          start."
        sources:
          - source: fivebooks-woods-schopenhauer
            locator: "pick 1"
            verified: true
            checked_in: Five Books interview (web page), accessed 2026-11
    title: The Two Fundamental Problems of Ethics (On the Freedom of the Will; On the Basis of Morality)
    author: Arthur Schopenhauer
    year: 1841
    kind: primary
    tier: extended
    difficulty: 3
    note: Two prize essays, published together. Clear and self-contained; the Basis of Morality grounds ethics in compassion.

  - id: parerga
    tips:
      - text: >
          Woods recommends Hollingdale's selection, Essays and Aphorisms: "the
          most user-friendly writings of Schopenhauer".
        sources:
          - source: fivebooks-woods-schopenhauer
            locator: "pick 3"
            verified: true
            checked_in: Five Books interview (web page), accessed 2026-11
    title: Parerga and Paralipomena
    author: Arthur Schopenhauer
    year: 1851
    kind: primary
    tier: extended
    difficulty: 2
    note: >
      Essays and aphorisms (including "Aphorisms on the Wisdom of Life"), the book that
      finally brought him recognition. Easy to dip into at any point.
