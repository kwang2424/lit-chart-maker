id: schopenhauer
title: Arthur Schopenhauer
group: predecessors
sequence: 13
born: 1788
scope: >
  Schopenhauer's books in the order he asked readers to take them, plus the
  later essays that made him famous. He left unusually explicit instructions,
  so most links here come from his own prefaces.
status: draft

