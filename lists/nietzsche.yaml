id: nietzsche
title: Friedrich Nietzsche
group: thinkers
sequence: 1
born: 1844
scope: >
  Nietzsche's published books, the background he assumes, and a few
  standard secondary guides. Not his unpublished notebooks (Nachlass).
status: draft   # draft -> reviewed -> stable

# Each work:
#   tier:        core | extended | optional
#   kind:        primary (by the author) | secondary (guide/commentary) | background
#   difficulty:  1 (easy) .. 5 (very hard)
#   position:    start | end   (optional; pins a non-core work to the start or end)
#   tier_note:   why the tier differs from what the survey suggests (silences that warning)
#   start_here:  {why, sources}  (optional; a sourced claim that this is a good first book)
#   tips:        [{text, sources}]  (optional; sourced advice on how to read it)
#   after:       links to works best read first
#     strength:  required | helpful | context
#     why:       one sentence, in plain words
#     sources:   [{source, locator, verified, checked_in, reviewed_by}]
#
# Rule: `required` links and `start_here` need at least one tier 1 or 2 source.
# `verified: true` means the passage was read in the text named in `checked_in` (so far by
# Claude, an AI). A person who re-checks it adds `reviewed_by: <name>`. See tools/citations.py.

# What independent sources assign. See tools/consensus.py.
