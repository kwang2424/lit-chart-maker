id: hume
title: David Hume
group: predecessors
sequence: 4
born: 1711
scope: >
  Hume's philosophical works. Courses mostly teach the Treatise; Hume himself asked
  to be judged by the later Enquiries. This list shows both and lets you choose.
status: draft

