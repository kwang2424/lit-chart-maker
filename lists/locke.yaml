id: locke
title: John Locke
group: predecessors
sequence: 6
born: 1632
scope: >
  Locke's philosophical, political and religious works: the Essay Concerning Human
  Understanding, the Two Treatises of Government and the Letter Concerning Toleration
  (all 1689), and the later writings on education and religion. His economic papers are
  left out. Courses split between the Essay (philosophy) and the Second Treatise
  (politics), so the survey has two starting points.
status: draft

