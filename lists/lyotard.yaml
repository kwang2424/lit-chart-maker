id: lyotard
title: Jean-François Lyotard
group: thinkers
sequence: 9
born: 1924
scope: >
  Lyotard's books from the 1954 Phenomenology to the unfinished Confession of
  Augustine: the libidinal works of the 1970s, the "postmodern" works around 1980, and
  the later books on time, the sublime and Kant. Few public Lyotard syllabi exist, so
  the survey is thin and the order leans on the SEP and IEP.
status: draft

# Format: see the header of lists/nietzsche.yaml. His texts are in copyright; the
# evidence is the SEP and IEP entries and the few course outlines found. Years are
# first French publication, as the SEP and IEP bibliographies give them.

survey:
  - source: syl-lingnan-phi4369
    starts_with: postmodern-condition
    includes: [postmodern-condition, differend, inhuman]
    ordered: false
    locator: "indicative content, unit 1 (Lyotard) and readings"
    verified: true
    checked_in: Course outline (PDF), accessed 2026-11
  - source: syl-auckland-french711
    includes: [libidinal-economy]
    ordered: true
    locator: class schedule, week 10 (pp. 1–42)
    verified: true
    checked_in: Course syllabus (web page), accessed 2026-11
  - source: mscp-jones-lyotard
    covers: beginning
    starts_with: phenomenology
    includes: [phenomenology, why-philosophize, discourse-figure, libidinal-economy]
    ordered: true
