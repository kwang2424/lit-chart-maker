id: bergson
title: Henri Bergson
group: predecessors
sequence: 19
born: 1859
scope: >
  Bergson's major books, which courses read in publication order, and the essay
  the SEP calls the reading guide to his whole philosophy. Background for Deleuze
  (Bergsonism) and for Jung's idea of psychic energy.
status: draft

