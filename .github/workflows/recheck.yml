name: recheck quotes
# Monthly: fetch every cited source that can be fetched and check that the quoted
# phrases are still there. Sources change (the SEP revises entries, syllabi move);
# a failed run lists what to look at.
on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt
      - run: python tools/recheck.py --refresh
