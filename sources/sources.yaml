# Shared bibliography. Every claim in a list cites a source by `id`.
#
# tier:
#   1 author     - the author's own statements (books, prefaces, letters, interviews)
#   2 scholarly  - peer-reviewed or academic-press guides, companions, encyclopedias
#   3 syllabus   - what university courses assign, and in what order
#   4 community  - reading guides from forums, blogs, etc. (hints only)

- id: nietzsche-ecce-homo
  tier: 1
  author: Friedrich Nietzsche
  title: Ecce Homo
  year: 1888
  note: Chapter "Why I Write Such Good Books" reviews each earlier book in turn.

- id: nietzsche-genealogy-text
  tier: 1
  author: Friedrich Nietzsche
  title: On the Genealogy of Morality (title page and Preface)
  year: 1887

- id: nietzsche-gay-science-text
  tier: 1
  author: Friedrich Nietzsche
  title: The Gay Science
  year: 1882

- id: nietzsche-birth-of-tragedy-text
  tier: 1
  author: Friedrich Nietzsche
  title: The Birth of Tragedy (with its "Foreword to Richard Wagner")
  year: 1872

- id: nietzsche-antichrist-text
  tier: 1
  author: Friedrich Nietzsche
  title: The Antichrist
  year: 1895

- id: nietzsche-self-criticism
  tier: 1
  author: Friedrich Nietzsche
  title: '"Attempt at a Self-Criticism" (1886 preface to The Birth of Tragedy)'
  year: 1886

- id: nietzsche-letter-burckhardt-1886
  tier: 1
  author: Friedrich Nietzsche
  title: Letter to Jacob Burckhardt, 22 September 1886
  year: 1886
  url: http://www.nietzschesource.org/#eKGWB/BVN-1886,754

- id: nietzsche-untimely-schopenhauer
  tier: 1
  author: Friedrich Nietzsche
  title: '"Schopenhauer as Educator" (Untimely Meditations III)'
  year: 1874

- id: sep-nietzsche
  tier: 2
  author: R. Lanier Anderson
  title: '"Friedrich Nietzsche", Stanford Encyclopedia of Philosophy'
  url: https://plato.stanford.edu/entries/nietzsche/

- id: tanner-vsi
  tier: 2
  author: Michael Tanner
  title: 'Nietzsche: A Very Short Introduction'
  publisher: Oxford University Press
  year: 2000

- id: kaufmann-nietzsche
  tier: 2
  author: Walter Kaufmann
  title: 'Nietzsche: Philosopher, Psychologist, Antichrist'
  publisher: Princeton University Press
  year: 1950

- id: leiter-guidebook
  tier: 2
  author: Brian Leiter
  title: Nietzsche on Morality (2nd ed.)
  publisher: Routledge
  year: 2015
  note: First edition (2002) was titled Routledge Philosophy GuideBook to Nietzsche on Morality.

- id: lampert-teaching
  tier: 2
  author: Laurence Lampert
  title: "Nietzsche's Teaching: An Interpretation of Thus Spoke Zarathustra"
  publisher: Yale University Press
  year: 1986

- id: young-biography
  tier: 2
  author: Julian Young
  title: 'Friedrich Nietzsche: A Philosophical Biography'
  publisher: Cambridge University Press
  year: 2010

# ---------- Deleuze ----------

- id: sep-deleuze
  tier: 2
  author: Daniel Smith, John Protevi, Daniela Voss
  title: '"Gilles Deleuze", Stanford Encyclopedia of Philosophy'
  url: https://plato.stanford.edu/entries/deleuze/

- id: deleuze-guattari-atp-text
  tier: 1
  author: Gilles Deleuze & Félix Guattari
  title: A Thousand Plateaus ("Author's Note")
  year: 1980

- id: deleuze-harsh-critic
  tier: 1
  author: Gilles Deleuze
  title: '"Letter to a Harsh Critic" (1973), in Negotiations'
  publisher: Columbia University Press
  year: 1995

- id: williams-dr-guide
  tier: 2
  author: James Williams
  title: "Gilles Deleuze's Difference and Repetition: A Critical Introduction and Guide"
  publisher: Edinburgh University Press
  year: 2004

- id: holland-ao-guide
  tier: 2
  author: Eugene Holland
  title: "Deleuze and Guattari's Anti-Oedipus: Introduction to Schizoanalysis"
  publisher: Routledge
  year: 1999

- id: massumi-users-guide
  tier: 2
  author: Brian Massumi
  title: A User's Guide to Capitalism and Schizophrenia
  publisher: MIT Press
  year: 1992

