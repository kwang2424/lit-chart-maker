id: medieval-literature
title: Medieval Literature
scope: >
  European literature of the Middle Ages, in Old and Middle English and in translation, as
  university courses teach it: epic and saga, Arthurian romance, Dante, Boccaccio, Chaucer
  and the late medieval writers of England. Built from six courses, including two MIT
  OpenCourseWare courses and Giuseppe Mazzotta's Open Yale lectures on Dante. Dates are
  approximate, as they are for most medieval works.
order: year

