  - id: inferno
    title: "The Divine Comedy: Inferno"
    author: Dante Alighieri
    year: 1314
    date: c. 1308–1314
    after:
      - work: vita-nuova
        strength: context
        why: >
          The Vita Nuova ends with Dante's hope "that I shall yet write concerning her what
          hath not before been written of any woman"; in Inferno II Beatrice herself sends
          Virgil to guide him ("Beatrice am I, who do bid thee go").
        sources:
          - source: dante-vita-nuova-text
            locator: "§XLIII (final chapter)"
            verified: true
            checked_in: "Rossetti trans., Project Gutenberg #41085"
          - source: dante-inferno-text
            locator: "Canto II"
            verified: true
            checked_in: "Longfellow trans., Project Gutenberg #1001"
  - id: purgatorio
    title: "The Divine Comedy: Purgatorio"
    author: Dante Alighieri
    year: 1315
    date: c. 1308–1315
    after:
      - work: inferno
        strength: required
        why: >
          The second part of one journey. It opens as the "little vessel of my genius ...
          leaves behind itself a sea so cruel": "And of that second kingdom will I sing".
        sources:
          - source: dante-purgatorio-text
            locator: "Canto I, lines 1–6"
            verified: true
            checked_in: "Longfellow trans., Project Gutenberg #1002"
  - id: paradiso
    title: "The Divine Comedy: Paradiso"
    author: Dante Alighieri
    year: 1320
    date: c. 1316–1321
    after:
      - work: purgatorio
        strength: required
        why: >
          The last part of the journey. Canto II opens by addressing readers "who in some
          pretty little boat, / Eager to listen, have been following / Behind my ship".
        sources:
          - source: dante-paradiso-text
            locator: "Canto II, lines 1–3"
            verified: true
            checked_in: "Longfellow trans., Project Gutenberg #1003"
  - id: decameron
    title: The Decameron
    author: Giovanni Boccaccio
    year: 1353
    date: c. 1349–1353
  - id: piers-plowman
    title: Piers Plowman
    author: William Langland
    year: 1377
    date: c. 1370–1390
  - id: troilus
    title: Troilus and Criseyde
    author: Geoffrey Chaucer
    year: 1385
    date: c. 1385
    after:
      - work: medieval-philosophy:consolation
        strength: context
        why: >
          Chaucer translated the Consolation into English, and the SEP names Troilus and
          Criseyde among the works its "literary features, as well as its arguments, inspired".
        sources:
          - source: sep-boethius
            locator: "§8 Boethius's Influence and Importance"
            verified: true
            checked_in: SEP entry, accessed 2026-11
  - id: gawain
