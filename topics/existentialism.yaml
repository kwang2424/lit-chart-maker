id: existentialism
title: Existentialism
scope: >
  The existentialist tradition as introductory university courses teach it, from
  Kierkegaard and Nietzsche through Heidegger to Sartre and Merleau-Ponty. Built from
  five courses, including Hubert Dreyfus's well-known Berkeley lectures. Camus, Beauvoir,
  Dostoevsky and others these courses read are not yet on this site and are listed below.

