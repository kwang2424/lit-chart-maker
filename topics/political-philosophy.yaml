id: political-philosophy
title: Political Philosophy, Plato to Marx
scope: >
  The canon of Western political thought as introductory courses teach it: Plato and
  Aristotle, then Machiavelli, Hobbes, Locke and Rousseau, with Kant and Marx. Built from
  three courses, including Steven Smith's recorded Yale lectures. Tocqueville, Mill,
  Burke and others they read are not yet on this site and are listed below.

